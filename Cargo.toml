[package]
name = "pixel"
version = "0.1.0"
edition = "2024"
authors = ["Nans Rey <nans2502@gmail.com>"]
license = "GPL-2.0-only"

# The binary keeps the project's name (Makefile, systemd service)
[[bin]]
name = "PIxel"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
# `serde`: lets serde read dates and times straight from the JSON of the APIs
chrono = { version = "0.4.39", features = ["serde"] }
embedded-graphics = "0.8.1"
# Only compiled with `--features simulator`: never built for the Raspberry Pi
embedded-graphics-simulator = { version = "0.8.0", optional = true }
embedded-layout = "0.4.2"
# Simulator only: closing its window sends SIGINT (already compiled for tokio)
libc = { version = "0.2", optional = true }
# HTTPS with rustls, like yup-oauth2: a single TLS stack, no OpenSSL to cross-compile
reqwest = { version = "0.12.14", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
tinybmp = "0.7.0"
tokio = { version = "1.44.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "registry"] }
# Fonts made for small screens. The feature adds `U8g2TextStyle`, a text style for
# embedded-graphics' `Text`
u8g2-fonts = { version = "0.9.1", features = ["embedded_graphics_textstyle"] }
yup-oauth2 = "12.1.0"

[features]
# Shows the matrix in a window on the host PC instead of driving the real panel:
# `cargo run --features simulator` (needs SDL2: `sudo apt install libsdl2-dev`)
simulator = ["dep:embedded-graphics-simulator", "dep:libc"]

# Extra lints, checked by `cargo clippy` on the whole project
[lints.clippy]
# Every `unsafe` block or `unsafe impl` must say why it is sound, in a `// SAFETY:` comment
undocumented_unsafe_blocks = "warn"

# Only compiled by `cargo test`
[dev-dependencies]
serde_json = "1.0.140"

[build-dependencies]
bindgen = "0.73.2"

[profile.release]
# Whole-program optimization: smallest, fastest binary for the Pi Zero,
# at the cost of longer release builds
lto = true
codegen-units = 1
