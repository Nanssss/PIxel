[package]
name = "PIxel"
version = "0.1.0"
edition = "2024"
authors = ["Nans Rey <nans2502@gmail.com>"]
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0.100"
cc = "1.11.1"
chrono = "0.4.39"
embedded-graphics = "0.8.1"
hyper-util = "0.1.17"
openssl = { version = "0.10.82", features = ["vendored"] }
reqwest = { version = "0.12.14", features = ["blocking", "json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "registry"] }
yup-oauth2 = "12.1.0"

[build-dependencies]
bindgen = "0.73.2"
